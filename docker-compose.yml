version: '3.8'

# PRODUCTION docker-compose
# Pro development použij: docker-compose -f docker-compose.dev.yml up

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Nepublikujeme port ven v produkci

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: bash -c "./entrypoint.sh"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Nginx reverse proxy pro produkci
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/staticfiles:/var/www/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
